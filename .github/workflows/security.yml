name: Security

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened ]
  schedule:
    # Monday 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.2
      - name: Trivy filesystem scan (Go & NPM deps)
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --format sarif --output trivy-fs-results.sarif .
        continue-on-error: true
      - name: Trivy Dockerfile scan
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --format sarif --output trivy-dockerfile-results.sarif Dockerfile
        continue-on-error: true
      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
      - name: Upload Trivy Dockerfile SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-dockerfile-results.sarif') != ''
        with:
          sarif_file: trivy-dockerfile-results.sarif
          category: trivy-dockerfile

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: true
      - name: govulncheck
        uses: golang/govulncheck-action@v1.0.4
        with:
          repo-checkout: false
        continue-on-error: true

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: cd web && npm ci --legacy-peer-deps
      - name: npm audit (production deps)
        run: cd web && npm audit --audit-level=high --omit=dev
        continue-on-error: false
