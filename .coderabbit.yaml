# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!web/node_modules/**"
    - "!web/dist/**"
    - "!**/*.generated.go"
  high_level_summary: true
  poem: false
  review_status: true
  auto_reply: true
